<!-- @dsCard group="Primitives" height=200 subtitle="on, off, disabled" -->
<!doctype html>
<html lang="ja">
  <head>
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="../bundle.css" />
    <script src="../bundle.js"></script>
    <meta charset="utf-8" />
    <title>Switch</title>
    <style>
      html,
      body {
        margin: 0;
      }
      .pair-src {
        padding: 32px 24px;
      }
      .row {
        display: flex;
        gap: 28px;
        flex-wrap: wrap;
      }
      .sw {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div data-pair="stack" class="pair-src">
      <div class="row">
        <label class="sw"
          ><button
            class="kd-switch"
            role="switch"
            aria-checked="true"
            aria-label="切り替え"
          ></button
          ><span>オン</span></label
        ><label class="sw"
          ><button
            class="kd-switch"
            role="switch"
            aria-checked="false"
            aria-label="切り替え"
          ></button
          ><span>オフ</span></label
        ><label class="sw"
          ><button
            class="kd-switch"
            role="switch"
            aria-checked="true"
            disabled
            aria-label="切り替え"
          ></button
          ><span>オン（変更不可）</span></label
        ><label class="sw"
          ><button
            class="kd-switch"
            role="switch"
            aria-checked="false"
            disabled
            aria-label="切り替え"
          ></button
          ><span>オフ（変更不可）</span></label
        >
      </div>
    </div>
    <script>
      window.Kodama && Kodama.pair()
    </script>
  </body>
</html>
