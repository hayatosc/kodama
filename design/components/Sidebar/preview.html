<!-- @dsCard group="Composites" height=720 subtitle="the main agent gets the featured slot" -->
<!doctype html>
<html lang="ja">
  <head>
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="../bundle.css" />
    <script src="../bundle.js"></script>
    <meta charset="utf-8" />
    <title>Sidebar</title>
    <style>
      html,
      body {
        margin: 0;
      }
      .kd-pane {
        background: var(--sidebar);
        height: 720px;
      }
      .kd-sidebar {
        height: 720px;
        width: auto;
      }
      .kd-pane-label {
        top: auto;
        bottom: 62px;
      }
    </style>
  </head>
  <body>
    <div data-pair="row" class="pair-src">
      <nav class="kd-sidebar" aria-label="エージェント">
        <div class="kd-sidebar-head">
          <button class="kd-circle-btn" aria-label="検索">
            <svg class="kd-icon" viewBox="0 0 16 16">
              <circle cx="7" cy="7" r="4.5" />
              <path d="m13.5 13.5-3.2-3.2" />
            </svg></button
          ><button class="kd-circle-btn" aria-label="新しいエージェント">
            <svg class="kd-icon" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" /></svg>
          </button>
        </div>
        <a class="kd-featured" aria-current="page"
          ><span
            data-avatar="ink"
            data-shape="mochi"
            data-mood="running"
            style="--size: 56px"
          ></span
          ><span
            ><span class="kd-featured-kicker">メイン</span><br /><span class="kd-featured-name"
              >assistant</span
            ><span class="kd-featured-sub"
              ><span style="color: var(--running)">実行中</span> · research と調査中</span
            ></span
          ></a
        >
        <div class="kd-sidebar-label">エージェント</div>
        <a class="kd-row"
          ><span data-avatar="violet" data-shape="drop" data-mood="live" style="--size: 36px"></span
          ><span class="kd-row-text"
            ><span class="kd-row-top"
              ><span class="kd-row-name">research</span><span class="kd-count">2</span></span
            ><span class="kd-row-sub">論文3件の要約を返しました</span></span
          ></a
        ><a class="kd-row"
          ><span data-avatar="teal" data-shape="bean" data-mood="queued" style="--size: 36px"></span
          ><span class="kd-row-text"
            ><span class="kd-row-top"
              ><span class="kd-row-name">scheduler</span
              ><span class="kd-row-meta">03:00</span></span
            ><span class="kd-row-sub">次は 03:00 に起きます</span></span
          ></a
        ><a class="kd-row"
          ><span
            data-avatar="red"
            data-shape="onigiri"
            data-mood="error"
            style="--size: 36px"
          ></span
          ><span class="kd-row-text"
            ><span class="kd-row-top"
              ><span class="kd-row-name">mailer</span><span class="kd-row-meta">1時間</span></span
            ><span class="kd-row-sub">認証情報が見つかりません</span></span
          ></a
        ><a class="kd-row"
          ><span data-avatar="orange" data-shape="drop" data-mood="idle" style="--size: 36px"></span
          ><span class="kd-row-text"
            ><span class="kd-row-top"
              ><span class="kd-row-name">clipper</span><span class="kd-row-meta">昨日</span></span
            ><span class="kd-row-sub">記事を5件保存しました</span></span
          ></a
        ><a class="kd-row"
          ><span
            data-avatar="pink"
            data-shape="mochi"
            data-mood="paused"
            style="--size: 36px"
          ></span
          ><span class="kd-row-text"
            ><span class="kd-row-top"
              ><span class="kd-row-name">writer</span><span class="kd-row-meta">3日</span></span
            ><span class="kd-row-sub">一時停止中</span></span
          ></a
        >
        <div class="kd-sidebar-label">システム</div>
        <a class="kd-row"
          ><span
            data-avatar="system"
            data-shape="bean"
            data-mood="running"
            data-badge="off"
            style="--size: 36px"
          ></span
          ><span class="kd-row-text"
            ><span class="kd-row-top"
              ><span class="kd-row-name kd-mono" style="font-size: 14px">system:memory</span
              ><span class="kd-row-meta">12件</span></span
            ><span class="kd-row-sub">記憶の抽出キューを処理中</span></span
          ></a
        >
        <span style="flex: 1"></span>
        <div class="kd-sidebar-foot">
          <span class="kd-me">H</span><span style="flex: 1; font-weight: 600">hayatosc</span
          ><button class="kd-btn kd-btn-ghost kd-btn-icon" aria-label="設定">
            <svg class="kd-icon" viewBox="0 0 16 16">
              <rect x="3" y="3" width="4" height="4" rx="1" />
              <rect x="9" y="3" width="4" height="4" rx="1" />
              <rect x="3" y="9" width="4" height="4" rx="1" />
              <path d="M11 9v4M9 11h4" />
            </svg>
          </button>
        </div>
      </nav>
    </div>
    <script>
      window.Kodama && Kodama.pair()
    </script>
  </body>
</html>
