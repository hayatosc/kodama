<!-- @dsCard group="Primitives" height=180 subtitle="key hints" -->
<!doctype html>
<html lang="ja">
  <head>
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="../bundle.css" />
    <script src="../bundle.js"></script>
    <meta charset="utf-8" />
    <title>Kbd</title>
    <style>
      html,
      body {
        margin: 0;
      }
      .pair-src {
        padding: 32px 24px;
      }
      .row {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
      }
      .it {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: var(--muted-foreground);
      }
    </style>
  </head>
  <body>
    <div data-pair="stack" class="pair-src">
      <div class="row">
        <span class="it"><kbd class="kd-kbd">Tab</kbd><span>キューに追加</span></span
        ><span class="it"><kbd class="kd-kbd">⏎</kbd><span>送信・割り込み</span></span
        ><span class="it"><kbd class="kd-kbd">⇧ ⏎</kbd><span>改行</span></span
        ><span class="it"><kbd class="kd-kbd">Esc</kbd><span>閉じる</span></span
        ><span class="it"><kbd class="kd-kbd">⌘ K</kbd><span>検索</span></span>
      </div>
    </div>
    <script>
      window.Kodama && Kodama.pair()
    </script>
  </body>
</html>
