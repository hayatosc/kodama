<!-- @dsCard group="Content" height=600 subtitle="what an agent did while nobody watched" -->
<!doctype html>
<html lang="ja">
  <head>
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="../bundle.css" />
    <script src="../bundle.js"></script>
    <meta charset="utf-8" />
    <title>ActivityFeed</title>
    <style>
      html,
      body {
        margin: 0;
      }
      .pair-src {
        padding: 24px 32px;
        max-width: 640px;
      }
    </style>
  </head>
  <body>
    <div data-pair="stack" class="pair-src">
      <ol class="kd-activity">
        <li>
          <time>09:00</time><span class="kd-node"><span class="kd-dot kd-dot-running"></span></span
          ><span><strong>朝のまとめを作成中</strong> <span class="kd-detail">· cron</span></span>
        </li>
        <li>
          <time>08:12</time
          ><span class="kd-node"
            ><svg class="kd-icon" viewBox="0 0 16 16" style="color: var(--muted-foreground)">
              <path d="M3 5h9l-2-2M13 11H4l2 2" /></svg></span
          ><span><strong>research</strong> <span class="kd-detail">から返信 · 論文3件</span></span>
        </li>
        <li>
          <time>03:00</time
          ><span class="kd-node"
            ><svg class="kd-icon" viewBox="0 0 16 16" style="color: var(--muted-foreground)">
              <circle cx="8" cy="8" r="6" />
              <path d="M8 5v3l2 1.5" /></svg></span
          ><span
            ><strong>アラームで再開</strong>
            <span class="kd-detail">· 中断した run を復旧</span></span
          >
        </li>
        <li>
          <time>02:41</time
          ><span class="kd-node"
            ><svg class="kd-icon" viewBox="0 0 16 16" style="color: var(--muted-foreground)">
              <path
                d="M3 3.5h4a1 1 0 0 1 1 1V13a1 1 0 0 0-1-1H3zM13 3.5H9a1 1 0 0 0-1 1V13a1 1 0 0 1 1-1h4z"
              /></svg></span
          ><span
            ><strong>記憶を抽出</strong> <span class="kd-detail">· 2件追加、1件更新</span></span
          >
        </li>
        <li>
          <time>02:40</time><span class="kd-node"><span class="kd-dot kd-dot-error"></span></span
          ><span
            ><strong style="color: var(--destructive)">web_fetch 失敗</strong>
            <span class="kd-detail">· 403 Forbidden</span></span
          >
        </li>
        <li>
          <time>昨日</time><span class="kd-node"><span class="kd-dot"></span></span
          ><span><strong>設定 v12 を適用</strong> <span class="kd-detail">· v11 から</span></span>
        </li>
      </ol>
    </div>
    <script>
      window.Kodama && Kodama.pair()
    </script>
  </body>
</html>
