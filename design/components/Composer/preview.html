<!-- @dsCard group="Composites" height=1200 subtitle="Enter sends · Tab queues while the agent is running · try it" -->
<!doctype html>
<html lang="ja">
  <head>
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="../bundle.css" />
    <script src="../bundle.js"></script>
    <meta charset="utf-8" />
    <title>Composer</title>
    <style>
      html,
      body {
        margin: 0;
      }
      .pair-src {
        padding: 28px 32px 24px;
        display: flex;
        flex-direction: column;
        gap: 28px;
        box-sizing: border-box;
      }
      .chat {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 720px;
        width: 100%;
        margin: 0 auto;
      }
      .log {
        height: 200px;
        overflow: auto;
        padding: 4px 2px;
      }
      .states {
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .kd-composer-wrap {
        max-width: 720px;
        width: 100%;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div data-pair="stack" class="pair-src">
      <div class="chat" data-kd-chat>
        <div class="log kd-transcript" data-kd-log>
          <div class="kd-msg kd-msg-user">Durable Objects のアラームについてまとめて</div>
          <div class="kd-bubble kd-msg"><p>了解しました。</p></div>
        </div>
        <div class="kd-composer-wrap" data-kd-live data-running="false" data-agent="assistant">
          <div class="kd-queue" hidden>
            <div class="kd-queue-head">
              <span class="kd-queue-count" hidden>キュー 0</span
              ><span class="kd-queue-note" hidden>実行が終わったら順に送ります</span
              ><span class="kd-queue-add" hidden><kbd class="kd-kbd">Tab</kbd> でキューに追加</span>
            </div>
            <div class="kd-queue-items"></div>
          </div>
          <div class="kd-composer">
            <button class="kd-chip kd-chip-icon" aria-label="添付">
              <svg class="kd-icon" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" /></svg></button
            ><input placeholder="assistantにメッセージ" aria-label="メッセージ" /><span
              class="kd-composer-right"
            ></span>
          </div>
        </div>
      </div>
      <div class="states">
        <div class="kd-composer-wrap" data-kd-live data-running="false" data-agent="assistant">
          <div class="kd-queue" hidden>
            <div class="kd-queue-head">
              <span class="kd-queue-count" hidden>キュー 0</span
              ><span class="kd-queue-note" hidden>実行が終わったら順に送ります</span
              ><span class="kd-queue-add" hidden><kbd class="kd-kbd">Tab</kbd> でキューに追加</span>
            </div>
            <div class="kd-queue-items"></div>
          </div>
          <div class="kd-composer">
            <button class="kd-chip kd-chip-icon" aria-label="添付">
              <svg class="kd-icon" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" /></svg></button
            ><input placeholder="assistantにメッセージ" aria-label="メッセージ" /><span
              class="kd-composer-right"
            ></span>
          </div>
        </div>
        <div class="kd-composer-wrap" data-kd-live data-running="true" data-agent="assistant">
          <div class="kd-queue" hidden>
            <div class="kd-queue-head">
              <span class="kd-queue-count" hidden>キュー 0</span
              ><span class="kd-queue-note" hidden>実行が終わったら順に送ります</span
              ><span class="kd-queue-add" hidden><kbd class="kd-kbd">Tab</kbd> でキューに追加</span>
            </div>
            <div class="kd-queue-items"></div>
          </div>
          <div class="kd-composer">
            <button class="kd-chip kd-chip-icon" aria-label="添付">
              <svg class="kd-icon" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" /></svg></button
            ><input
              value="出典のURLも添えて"
              placeholder="assistantにメッセージ"
              aria-label="メッセージ"
            /><span class="kd-composer-right"></span>
          </div>
        </div>
        <div class="kd-composer-wrap" data-kd-live data-running="true" data-agent="assistant">
          <div class="kd-queue">
            <div class="kd-queue-head">
              <span class="kd-queue-count">キュー 2</span
              ><span class="kd-queue-note">実行が終わったら順に送ります</span
              ><span class="kd-queue-add" hidden><kbd class="kd-kbd">Tab</kbd> でキューに追加</span>
            </div>
            <div class="kd-queue-items">
              <div class="kd-queue-item">
                <span class="kd-queue-num">1</span
                ><span class="kd-queue-text">出典のURLも添えて</span
                ><button
                  class="kd-chip kd-chip-icon kd-queue-x"
                  data-kd-unqueue
                  aria-label="キューから外す"
                >
                  <svg class="kd-icon" viewBox="0 0 16 16">
                    <path d="M4.5 4.5l7 7M11.5 4.5l-7 7" />
                  </svg>
                </button>
              </div>
              <div class="kd-queue-item">
                <span class="kd-queue-num">2</span
                ><span class="kd-queue-text">最後に3行で要約して</span
                ><button
                  class="kd-chip kd-chip-icon kd-queue-x"
                  data-kd-unqueue
                  aria-label="キューから外す"
                >
                  <svg class="kd-icon" viewBox="0 0 16 16">
                    <path d="M4.5 4.5l7 7M11.5 4.5l-7 7" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <div class="kd-composer">
            <button class="kd-chip kd-chip-icon" aria-label="添付">
              <svg class="kd-icon" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" /></svg></button
            ><input placeholder="assistantにメッセージ" aria-label="メッセージ" /><span
              class="kd-composer-right"
            ></span>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.Kodama && Kodama.pair()
    </script>
  </body>
</html>
