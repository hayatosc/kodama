<!-- @dsCard group="Controls" height=660 subtitle="confirming a destructive action · cancel, confirm, Esc, click outside" -->
<!doctype html>
<html lang="ja">
  <head>
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="../bundle.css" />
    <script src="../bundle.js"></script>
    <meta charset="utf-8" />
    <title>Dialog</title>
    <style>
      html,
      body {
        margin: 0;
      }
      .pair-src {
        padding: 0;
      }
      .stage {
        position: relative;
        height: 330px;
        padding: 24px;
        box-sizing: border-box;
        background: var(--sidebar);
      }
      .kd-dialog-layer {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div data-pair="stack" class="pair-src">
      <div class="stage">
        <button class="kd-btn kd-btn-destructive" data-kd-dialog-open="archive">
          writer をアーカイブ…
        </button>
        <div class="kd-dialog-layer" data-kd-dialog="archive">
          <div class="kd-scrim">
            <div class="kd-dialog" role="alertdialog" aria-label="writer をアーカイブしますか？">
              <h3>writer をアーカイブしますか？</h3>
              <p>
                会話と記憶は残りますが、アラームとルーティンは止まり、新しいメッセージを受け取らなくなります。あとで元に戻せます。
              </p>
              <div class="kd-dialog-actions">
                <button class="kd-btn kd-btn-secondary" data-kd-dialog-close>キャンセル</button
                ><button class="kd-btn kd-btn-danger" data-kd-dialog-close>アーカイブ</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.Kodama && Kodama.pair()
    </script>
  </body>
</html>
