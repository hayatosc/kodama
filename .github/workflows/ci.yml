name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The workerd test project starts a runtime and sends every module to it per test file. That work
# is bound by the runner's CPU rather than by Vitest's worker count, so the tests are split across
# runners instead. See packages/agents/TESTING.md — CI sharding.
jobs:
  static:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: vp run typecheck
      - name: Lint
        run: vp run lint
      - name: Check formatting
        run: vp run format:check
      - name: Build agents
        working-directory: packages/agents
        run: vp run build

  test:
    name: Test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Test
        working-directory: packages/agents
        run: vp run test --shard=${{ matrix.shard }}/4

  # Keeps a single status for branch protection: it passes only when every job above passed.
  check:
    name: Check and build
    if: always()
    needs: [static, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "A required job finished with: $result"
              exit 1
            fi
          done
