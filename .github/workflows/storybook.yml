name: Storybook

# Builds the UI's Storybook as one HTML file and uploads it unzipped, so a pull request's
# Storybook opens straight in the browser from the link this workflow posts.
on:
  pull_request:
    paths:
      - packages/ui/**
      - design/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/storybook.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  html:
    name: Storybook HTML
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm and ni
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: |
            - args: [--global, '@antfu/ni@30.6.0']
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: ni --frozen-lockfile
      - name: Build Storybook as one HTML file
        working-directory: packages/ui
        env:
          KODAMA_BUILD_COMMIT: ${{ github.event.pull_request.head.sha }}
          KODAMA_BUILD_REF: ${{ github.head_ref }}
        run: nr build-storybook:html
      - name: Upload the HTML file
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # With archive: false the artifact is named after the file and is not zipped.
          path: packages/ui/storybook.html
          archive: false
          retention-days: 14
          if-no-files-found: error
      - name: Link it in the job summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "### 📖 Storybook for \`${COMMIT:0:8}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open storybook.html]($ARTIFACT_URL) (one HTML file, kept for 14 days)" >> "$GITHUB_STEP_SUMMARY"
      - name: Link it on the pull request
        # Pull requests from forks get a read-only token, so only same-repository ones are commented on.
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- kodama-storybook-html -->'
            const body = [
              marker,
              `### 📖 Storybook for \`${process.env.COMMIT.slice(0, 8)}\``,
              '',
              `**[Open storybook.html](${process.env.ARTIFACT_URL})**: the whole Storybook in one HTML file. It opens in the browser; no download or unzip.`,
              '',
              '<sub>Updated on every push that changes the UI. Viewing needs read access to this repository; the file is kept for 14 days.</sub>',
            ].join('\n')
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
